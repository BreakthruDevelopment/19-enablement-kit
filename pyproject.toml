[project]
name = "kit"
version = "0.1.0"
description = "The enablement kit: a read-only sandbox, a scaffold factory and review passes for legacy-code migration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Nothing from app 17 is pinned here: that pin belongs to slice 19.2.
dependencies = []

[project.scripts]
kit = "kit.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-timeout>=2.4.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts are the point of a test file.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["kit", "tests", "sample/generate_legacy_oms.py"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# A hung test fails after 60 s instead of stalling the run.
timeout = 60
