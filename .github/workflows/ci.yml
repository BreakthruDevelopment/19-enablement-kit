name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# GitHub's default run shell is `bash -e {0}`, which takes a pipeline's status from its LAST command. With pipefail a
# CLI that prints the expected line and then exits non-zero fails the smoke step instead of going green via `tee`.
defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The name is load-bearing: the branch ruleset requires exactly this string.
    name: Lint, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets: this slice's CI needs none, and no step reads any.
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict
      - run: uv run pytest
      - name: Build the package
        run: |
          uv build
          uv venv --python 3.12 /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/python -c "import kit, kit.core"
      - name: Smoke test (installed CLI)
        run: |
          /tmp/wheel-check/bin/kit --version | tee smoke.out
          grep -q "^kit 0.1.0$" smoke.out

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: kit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the CLI in the image
        run: docker run --rm kit:ci --version | grep -q "^kit 0.1.0$"
